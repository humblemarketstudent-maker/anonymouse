# Static site for Anonymouse.
# Render serves real files in dist first, then this rewrite sends
# client routes such as /inbox and /rooms/room_market to index.html.
services:
  - type: web
    name: anonymouse
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # npm ci skips devDependencies when NODE_ENV=production.
      # Vite and TypeScript live in devDependencies, so the build needs them.
      - key: NODE_ENV
        value: development
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  # Optional API. The static site above is unchanged and does not receive these
  # variables. Sync this Blueprint only when you want the agent deployed.
  - type: web
    name: anonymouse-moderation
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run moderation
    healthCheckPath: /api/moderation/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MODERATION_ADMIN_TOKEN
        generateValue: true
      - key: MODERATION_PUBLIC_INSPECT
        value: "true"
      - key: MODERATION_ALERT_WEBHOOK_URL
        sync: false
      - key: MODERATION_LLM_BASE_URL
        sync: false
      - key: MODERATION_LLM_API_KEY
        sync: false
      - key: MODERATION_LLM_MODEL
        sync: false
      - key: MODERATION_VISION_MODEL
        sync: false
      - key: MODERATION_ACTOR_SALT
        generateValue: true
